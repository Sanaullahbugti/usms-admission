name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: usms_admission
          MYSQL_USER: usms
          MYSQL_PASSWORD: usms
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: mysql://usms:usms@127.0.0.1:3306/usms_admission
      JWT_SECRET: ci-only-secret-value-with-more-than-32-characters
      CLIENT_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run db:generate
      - run: npm exec --workspace server prisma migrate deploy
      - run: npm run db:seed
        env:
          SEED_ADMIN_PASSWORD: ci-development-password-only
      - run: npm run typecheck
      - run: npm run build
